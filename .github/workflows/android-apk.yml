name: Build NAFE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'package.json'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16.0'
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.3.11579264
            cmdline-tools;latest

      - name: Setup Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Node dependencies
        run: npm ci

      - name: Initialize Tauri Android if needed
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi

      - name: Build Android Debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RENDER_API_URL: ${{ secrets.NEXT_PUBLIC_RENDER_API_URL }}
        run: npx tauri android build --apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAFE-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
